    <!--
      Set the theme before first paint. The site is dark by default; `.light`
      opts in. Without this the class lands after hydration and the page flashes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var light =
            stored === "light" ||
            (!stored && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- LCP image: stable public/ URL so it is preloadable, unlike a hashed import -->
    <link
      rel="preload"
      as="image"
      href="/img/hero-760.avif"
      type="image/avif"
      fetchpriority="high"
    />
  </head>
  <body>
